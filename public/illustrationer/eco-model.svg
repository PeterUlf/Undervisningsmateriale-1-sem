<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="ecoTitle ecoDesc">
  <title id="ecoTitle">OMD ECO-model (liggende 8-tal)</title>
  <desc id="ecoDesc">To sammenhængende løkker med tre kanallag (Paid, Earned, Owned) og fase-markører.</desc>

  <rect width="920" height="520" fill="#ffffff"/>

  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">OMD ECO-model</text>
  <text x="460" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Løsningsformat: to looppe (liggende 8-tal)</text>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Lag i 8-form -->
  <!-- Paid -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <ellipse cx="320" cy="240" rx="210" ry="120" stroke="#f59e0b" stroke-width="22" />
    <ellipse cx="600" cy="240" rx="210" ry="120" stroke="#f59e0b" stroke-width="22" />
  </g>

  <!-- Earned -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.94">
    <ellipse cx="320" cy="240" rx="170" ry="95" stroke="#38bdf8" stroke-width="18" />
    <ellipse cx="600" cy="240" rx="170" ry="95" stroke="#38bdf8" stroke-width="18" />
  </g>

  <!-- Owned -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <ellipse cx="320" cy="240" rx="130" ry="70" stroke="#22c55e" stroke-width="14" />
    <ellipse cx="600" cy="240" rx="130" ry="70" stroke="#22c55e" stroke-width="14" />
  </g>

  <!-- Mødepunkt / center -->
  <circle cx="460" cy="240" r="58" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
  <text x="460" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f766e">ECO</text>
  <text x="460" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f766e">Målgruppe</text>

  <!-- Kanal labels -->
  <text x="320" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#b45309">Paid</text>
  <text x="320" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#b45309">købt kontakt</text>

  <text x="600" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0284c7">Earned</text>
  <text x="600" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0284c7">omtale + anbefaling</text>

  <text x="460" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#15803d">Owned</text>
  <text x="460" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">egne kanaler</text>

  <!-- Fasekasser -->
  <g font-family="Arial, sans-serif">
    <rect x="150" y="390" width="140" height="88" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="220" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Trigger</text>
    <text x="220" y="429" text-anchor="middle" font-size="11" fill="#334155">Paid + Earned</text>
    <text x="220" y="446" text-anchor="middle" font-size="11" fill="#334155">første opdagelse</text>

    <rect x="310" y="390" width="140" height="88" rx="8" fill="#ecfeff" stroke="#0284c7" stroke-width="1.4"/>
    <text x="380" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Sår</text>
    <text x="380" y="429" text-anchor="middle" font-size="11" fill="#334155">Owned + Earned</text>
    <text x="380" y="446" text-anchor="middle" font-size="11" fill="#334155">første overvejelser</text>

    <rect x="470" y="390" width="140" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="540" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Høst</text>
    <text x="540" y="429" text-anchor="middle" font-size="11" fill="#334155">Paid + Earned</text>
    <text x="540" y="446" text-anchor="middle" font-size="11" fill="#334155">sammenligning</text>

    <rect x="630" y="390" width="140" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="700" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Oplevelse</text>
    <text x="700" y="429" text-anchor="middle" font-size="11" fill="#334155">Owned</text>
    <text x="700" y="446" text-anchor="middle" font-size="11" fill="#334155">konvertering/bekræftelse</text>

     <rect x="780" y="390" width="120" height="88" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
     <text x="840" y="411" text-anchor="middle" font-size="16" font-weight="700" fill="#854d0e">Loyalitet</text>
     <text x="840" y="429" text-anchor="middle" font-size="11" fill="#334155">Owned + Earned</text>
     <text x="840" y="446" text-anchor="middle" font-size="11" fill="#334155">anbefaling + return</text>
  </g>

  <!-- forbindelseslinjer under 8-formen -->
  <g fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round">
    <path d="M 220 390 L 860 390"/>
  </g>

  <text x="460" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">
    Købs-/beslutningsskift: mellem Høst og Oplevelse.
  </text>
</svg>
